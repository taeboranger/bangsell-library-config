apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bangsell-library-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/taeboranger/bangsell-library-config.git
    targetRevision: main
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: bangsell-library-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
