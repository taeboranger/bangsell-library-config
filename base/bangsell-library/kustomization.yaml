apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - monitor-deployment.yaml
  - service.yaml
  - ingress.yaml
  - certificate-anyproject.yaml
configMapGenerator:
  - name: bangsell-library-settings
    literals:
      - ANALYSIS_MODE=remote
      - ANALYZE_ON_START=true
      - AUTH_REQUIRED=true
      - APP_ORIGIN=https://bangsell.anyproject.dev
      - TZ=Asia/Seoul
