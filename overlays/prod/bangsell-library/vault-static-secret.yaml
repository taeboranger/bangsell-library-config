apiVersion: v1
kind: ServiceAccount
metadata:
  name: bangsell-library-vault-auth
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: bangsell-library-vault-auth
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: vault-secrets-operator-system/bangsell-library-vault
  kubernetes:
    role: bangsell-library-vso
    serviceAccount: bangsell-library-vault-auth
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: bangsell-library-runtime
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  type: kv-v2
  mount: kv
  path: bangsell-library-secret
  refreshAfter: 1h
  vaultAuthRef: bangsell-library-vault-auth
  rolloutRestartTargets:
    - kind: Deployment
      name: bangsell-library-deployment
  destination:
    create: true
    overwrite: true
    name: bangsell-library-secret
    transformation:
      excludeRaw: true
      excludes: ['.*']
      templates:
        SOOP_LOGIN_ID:
          text: '{{ get .Secrets "soop-username" }}'
        SOOP_LOGIN_PW:
          text: '{{ get .Secrets "soop-password" }}'
        DB_HOST:
          text: '{{ get .Secrets "db-host" }}'
        DB_PORT:
          text: '{{ default "3306" (get .Secrets "db-port") }}'
        DB_NAME:
          text: '{{ default "bangsell" (get .Secrets "db-name") }}'
        DB_USER:
          text: '{{ get .Secrets "db-username" }}'
        DB_PASSWORD:
          text: '{{ get .Secrets "db-password" }}'
        ADMIN_USERNAME:
          text: '{{ get .Secrets "admin-username" }}'
        ADMIN_PASSWORD:
          text: '{{ get .Secrets "admin-password" }}'
        WORKER_API_TOKEN:
          text: '{{ get .Secrets "worker-api-token" }}'
